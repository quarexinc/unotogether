<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yönetim paneli · Kartmasa</title>
<meta name="description" content="Kullanıcıları, yetkileri, odaları ve site ayarlarını yönet.">
<meta name="theme-color" content="#0a0310">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;800&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/pages.css">
</head>
<body>
<div id="app">
<header class="bar">
  <a class="brand" href="/" aria-label="Kartmasa">
    <img src="/logo.svg" alt="" width="34" height="34">
    <span class="brand-name">KARTMASA</span>
  </a>
  <nav class="nav" aria-label="Menü">
    <a href="/">Ana sayfa</a>
    <a href="/indir">Uygulamayı İndir</a>
  </nav>
  <div class="bar-right">
    <div class="acct" id="acct"></div>
  </div>
</header>

<main class="page" id="adm" hidden>
  <div class="page-head">
    <p class="eyebrow">Yönetim</p>
    <h1>Yönetim paneli</h1>
    <p>Kullanıcıları, yetkileri, odaları, yönlendirme kurallarını ve site ayarlarını buradan yönet.</p>
  </div>
  <div class="tabs" role="tablist" aria-label="Bölümler">
    <button type="button" role="tab" data-tab="overview" aria-selected="true">Genel bakış</button>
    <button type="button" role="tab" data-tab="users" aria-selected="false">Kullanıcılar</button>
    <button type="button" role="tab" data-tab="rooms" aria-selected="false">Odalar</button>
    <button type="button" role="tab" data-tab="gates" aria-selected="false">Yönlendirmeler</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false">Ayarlar</button>
    <button type="button" role="tab" data-tab="log" aria-selected="false">Günlük</button>
  </div>
  <section id="tab-overview" class="tabbody"></section>
  <section id="tab-users" class="tabbody" hidden></section>
  <section id="tab-rooms" class="tabbody" hidden></section>
  <section id="tab-gates" class="tabbody" hidden></section>
  <section id="tab-settings" class="tabbody" hidden></section>
  <section id="tab-log" class="tabbody" hidden></section>
</main>

<main class="page" id="gate">
  <div class="panel" style="max-width:520px;margin:40px auto">
    <h2 id="gate-h">Kontrol ediliyor…</h2>
    <p class="note" id="gate-p"></p>
    <div class="dl-cta" id="gate-cta"></div>
  </div>
</main>
</div>
<script src="/config.js"></script>
<script src="/auth.js"></script>
<script src="/gates.js"></script>
<script src="/admin.js"></script>
</body>
</html>
